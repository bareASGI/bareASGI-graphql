[project]
name = "bareASGI-graphQL"
version = "5.0.0"
description = "GraphQL support for the bareASGI framework"
authors = [
    { name = "Rob Blackbourn", email = "rob.blackbourn@gmail.com" }
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
]
readme = "README.md"
dependencies = [
    "bareASGI>=5.0.0,<6",
    "graphql-core>=3.1,<4",
]
license = "Apache-2.0"
license-files = [
    "LICENSE"
]
keywords = [
    "bareasgi",
]

[project.optional-dependencies]
graphene = [
    "graphene>=3.0,<4",
]
dev = [
    "autopep8",
    "coverage",
    "mypy",
    "pytest",
    "pytest-asyncio",
    "pylint",
    "types-setuptools",
    "types-graphene",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "jetblack-markdown",
    "mike",
]
examples = [
    "hypercorn",
    "uvicorn"
]

[project.urls]
Homepage = "https://bareASGI.github.io/bareASGI-graphql"
Repository = "https://github.com/bareASGI/bareASGI-graphql"
Issues = "https://github.com/bareASGI/bareASGI-graphql/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

# pylint
[tool.pylint.main]
py-version = "3.12"
jobs = 4

[tool.pylint.basic]
good-names = ["i", "j", "k", "ex", "Run", "_"]
bad-names = ["foo", "bar", "baz", "toto", "tutu", "tata"]

[tool.pylint."messages control"]
disable = [
    "missing-module-docstring",
]

# pytest
[tool.pytest.ini_options]
testpaths = [
    "tests",
]

# mypy
[tool.mypy]
files = [ "src", "tests", "examples" ]

[[tool.mypy.overrides]]
module = "pytest"
ignore_missing_imports = true
